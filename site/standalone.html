<body>
  <div id="app" role="status" aria-live="polite">

  <script type="module">
// ---- engine.js ----
/** 賽棋 Quad6 — dependency-free, deterministic rule engine. */

const MARTIAL = [
  ['雑十', '4-6', '5-5', 10],
  ['雑九', '3-6', '4-5', 9],
  ['雑八', '2-6', '3-5', 8],
  ['雑七', '2-5', '3-4', 7],
  ['雑六', '1-5', '2-4', 6],
  ['雑五', '1-4', '2-3', 5],
  ['雑四', '0-4', '1-3', 4],
  ['雑三', '0-3', '1-2', 3],
  ['雑二', '0-2', '1-1', 2],
];

const MARTIAL_LOOKUP = new Map(MARTIAL.map(([name, x, y, level]) => [pairKey(x, y), { name, level }]));
const ROLE_POINTS = { supreme: 20, civil: 15, martial: 10, common: 5 };
const DEFAULTS = { initialHand: 9, raiseUnit: 3, earlyBonus: 15, lastDrawPenalty: 15 };

function pairKey(a, b) { return [a, b].sort().join('+'); }
function random(seed) {
  let x = seed >>> 0;
  return () => {
    x += 0x6D2B79F5;
    let t = x;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

}
const assert = (condition, message) => { if (!condition) throw new Error(message); };
const tileKey = (tile) => `${Math.min(tile.a, tile.b)}-${Math.max(tile.a, tile.b)}`;
const tilePips = (tile) => tile.a + tile.b;
const getTile = (game, id) => game.tiles[id];
const totalScore = (game, player) => {
  const s = game.scores[player];
  return s.role + s.pips + s.raise + s.tableHonba + s.early - s.lastDraw - s.remaining;
};
function tileset() {
  const tiles = [];

function roleOf(game, ids) {

  if (pairKey(a, b) === pairKey('6-6', '0-0')) return { tier: 'supreme', name: '至尊', level: 99, points: 20 };
  if (a === b) {
    const tile = getTile(game, ids[0]);
    return { tier: 'civil', name: `文牌 ${tile.a}｜${tile.b}`, level: tile.a + tile.b, key: a, points: 15 };

  const martial = MARTIAL_LOOKUP.get(pairKey(a, b));

  if (tier[next.tier] !== tier[current.tier]) return tier[next.tier] > tier[current.tier];
  if (next.tier === 'civil') {
    // 0|0 pair is otherwise lowest, but it alone defeats the 6|6 pair.
    if (next.key === '0-0' && current.key === '6-6') return true;

  for (let i = 0; i < initialHand; i++) for (let p = 0; p < 2; p++) hands[p].push(stock.pop());

    version: 3, mode, seed, tiles, stock, hands,
    discard: [], board: null, current: startingPlayer, lead: startingPlayer, phase: 'opening', round: 1,
    final: false, lastDrawBy: null, lastDrawExempt: false,
    openingRole: null, raise: 0, lastOverwriter: null, passStreak: 0,
    scores: [0, 1].map(() => ({ role: 0, pips: 0, raise: 0, tableHonba: 0, early: 0, lastDraw: 0, remaining: 0 })),

}

function toFinal(game, player, exempt = false) {

function draw(game, player, exempt = false) {

    ids.every(id => game.hands[player].includes(id)), '交換牌に重複または手札外の牌があります');

function endRound(game) {

  game.raise = 0;
  game.lastOverwriter = null;

/** Live endpoints of the branching domino graph. */
function boardPorts(board) {
  if(!board)return [];

      const add=(v,parentPort)=>{
        board.items.push({...v,parent:parentPort.owner,via:parentPort.key,
          side:parentPort.side,direction:parentPort.direction ?? parentPort.side,slot:parentPort.slot});
        board.ports.push(...outgoingPorts(v,parentPort));
      };
      add(move.placements[0],port);
      if(move.placements.length===2){
        if(move.special)add(move.placements[1],second);
        else {
          // The second tile consumes the straight-ahead port of the first.
          board.ports=board.ports.filter(x=>x.key!==`tile-${move.placements[0].id}-0`);
          add(move.placements[1],{owner:move.placements[0].id,side:port.side,direction:port.direction ?? port.side,slot:0,key:`tile-${move.placements[0].id}-0`});
        }
      }
      award(game, p, 'pips', ids.reduce((s, id) => s + tilePips(getTile(game, id)), 0));
      game.passStreak = 0;
      record(game, `P${p + 1} ${ids.length}枚付札${move.special ? ' · 至尊の両側接続' : ''}`, p);
      if (checkEndHand(game, p)) break;
      game.current = nextActive(game, p);
      break;
    }
    case 'passAttach': {
      assert(game.phase === 'attachment', '付札フェーズではありません');
      if (game.final) {
        // Even after a pass, the player may return if the opponent extends the board.
        game.passStreak++;
        record(game, `P${p + 1} 最終付札をパス（連続${game.passStreak}回）`, p);
        if (game.passStreak >= 2) finish(game, 'exhaustion');
        else game.current = other(p);
      } else {
        const drawn = draw(game, p);
        record(game, `P${p + 1} パス · ${drawn ? '1枚ドロー' : '山札なし'}`, p);
        if (game.final) {
          // Drawing the last stock tile is still this player's attachment pass.
          game.passStreak = 1;
          game.current = other(p);
          break;
        }
        game.passStreak++;
        if (game.passStreak >= 2) endRound(game);
        else game.current = other(p);
      }
      break;
    }
    case 'adjust': {
      assert(game.phase === 'adjustment', '手札調整ではありません');
      assert(!game.adjustDone[p], '調整は各自1回です');
      assert(['draw', 'exchange'].includes(action.choice), '局間は1枚ドローか交換を選んでください');
      if (action.choice === 'exchange') {
        const ids = action.ids ?? (action.id == null ? [] : [action.id]);
        exchange(game,p,ids);
        record(game, `P${p + 1} ${ids.length}枚公開交換`, p);
      } else if (action.choice === 'draw') {
        assert(game.stock.length > 0, '山札がありません');
        draw(game, p);
        record(game, `P${p + 1} 1枚補充`, p);
      }
      game.adjustDone[p] = true;
      if (game.final) break;
      if (game.adjustDone.every(Boolean)) startAfterAdjust(game);
      else game.current = other(p);
      break;
    }
    default: throw new Error(`未対応のアクション: ${action.type}`);
  }
  return game;
}

/** An intentionally readable starter opponent, not an optimal solver. */
function bidExchangeTiles(game, player) {
  const hand=game.hands[player];
  const counts=new Map();
  for(const id of hand){
    const k=tileKey(getTile(game,id));
    counts.set(k,(counts.get(k)||0)+1);
  }
  // Preserve existing pairs and both Supreme components when possible.
  // At least one tile is replaceable even if the entire hand is protected.
  const loose=hand.filter(id=>{
    const key=tileKey(getTile(game,id));
    return counts.get(key)===1 && key!=='0-0' && key!=='6-6';
  });
  const pool=loose.length?loose:hand;
  const max=Math.min(pool.length,game.stock.length);
  if(!max)return [];
  const count=Math.min(max,Math.max(1,Math.ceil(pool.length*(.45+Math.random()*.45))));
  return [...pool].sort((a,b)=>tilePips(getTile(game,b))-tilePips(getTile(game,a)))
    .slice(0,count);
}

function chooseAIAction(game) {
  const p = game.current, hand = game.hands[p];
  if (game.phase === 'opening') {
    let candidates = handPairs(game, p, Boolean(game.board));
    // Spend the optional bidding exchange to chase a stronger role.
    // No role can beat Supreme, so exchanging there would only burn stock.
    const canTrade=!game.final&&!game.bidExchanged?.[p]&&game.stock.length>0;
    if (canTrade && game.board && candidates.length===0 &&
        game.openingRole?.tier!=='supreme' && Math.random()<.88) {
      const ids=bidExchangeTiles(game,p);
      if(ids.length)return {type:'bidExchange',ids};
    }
    if (candidates.length === 0) return { type: 'passOpen' };
    if(canTrade && !game.board && candidates.every(c=>c.role.tier==='common') &&
       Math.random()<.35){
      const ids=bidExchangeTiles(game,p);
      if(ids.length)return {type:'bidExchange',ids};
    }
    // Reserve supreme occasionally for the next round when opening the table.
    const tiers = { supreme: 5, civil: 4, martial: 3, common: 1 };
    candidates = candidates.map(c => ({ ...c, value: tiers[c.role.tier] * 15 + c.role.level * .7 + c.ids.reduce((v, id) => v + tilePips(getTile(game, id)), 0) * .2 }));
    if (game.board) {
      candidates.sort((a, b) => a.value - b.value);
      // Cheaper valid overwrite normally wins; occasionally seek power.
      if (game.final || Math.random() > .16) candidates = [candidates[0]];
      else candidates = [candidates[candidates.length - 1]];
    } else {
      candidates.sort((a, b) => b.value - a.value);
      if (candidates[0].role.tier === 'supreme' && Math.random() > .55 && candidates.length > 1) candidates.shift();
    }
    const picked = candidates[0];
    const flips = [false, false];
    return { type: 'open', ids: picked.ids, flips };
  }
  if (game.phase === 'attachment') {
    const options = allAttachmentMoves(game, p);
    if (!options.length) return { type: 'passAttach' };
    const scored = options.map(move => {
      const points = move.placements.reduce((sum, v) => sum + v.a + v.b, 0);
      const endValue = move.endValue;
      const compatible = hand.filter(id => !move.placements.some(v => v.id === id))
        .filter(id => { const t = getTile(game, id); return t.a === endValue || t.b === endValue; }).length;
      return { move, value: move.placements.length * 22 + points * .7 + compatible * 3 + (move.special ? 11 : 0) + move.placements.filter(v=>v.a===v.b).length*3 + Math.random() * 2 };
    });
    scored.sort((a, b) => b.value - a.value);
    const move = scored[0].move;
    return { type: 'attach', ids: move.placements.map(v => v.id), moveKey: move.key };
  }
  if (game.phase === 'adjustment') {
    if (game.stock.length === 0) return null; // Exhaustion already means final play.
    if (hand.length < 3 && Math.random() < .6) return { type: 'adjust', choice: 'draw' };
    if (Math.random() < .65 && hand.length >= 4) {
      const cnt = new Map();
      for (const id of hand) cnt.set(tileKey(getTile(game, id)), (cnt.get(tileKey(getTile(game, id))) || 0) + 1);
      const candidates = hand.filter(id => cnt.get(tileKey(getTile(game, id))) === 1)
        .filter(id => !['0-0', '6-6'].includes(tileKey(getTile(game, id))));
      if (candidates.length) {
        candidates.sort((a, b) => tilePips(getTile(game, b)) - tilePips(getTile(game, a)));
        // Discard some isolated high-pip tiles, preserving duplicate pairs and
        // the supreme components. Never request more tiles than remain in stock.
        const count = Math.min(candidates.length, game.stock.length, 1 + Math.floor(Math.random() * 3));
        if (count > 0) return { type: 'adjust', choice: 'exchange', ids: candidates.slice(0, count) };
      }
    }
    return { type: 'adjust', choice: 'draw' };
  }
  return null;
}

/** Multi-game match: 1/4/8 scheduled dealer hands, with dealer continuations. */

const MATCH_FORMATS = Object.freeze({
  single: { label: '一局戦', games: 1 },
  tonpu: { label: '東風戦', games: 4 },
  hanchan: { label: '半荘戦', games: 8 }
});
const STARTING_POINTS = 250;
const TABLE_HONBA_UNIT = 5;

/**
 * Mahjong-style designation for a scheduled hand.
 * Tonpu: 東1局..東4局; hanchan: 東1局..東4局, 南1局..南4局.
 * Dealer continuations retain the same designation and increment honba.
 */
function matchRoundName(format, handNumber, honba = 0) {
  if (!MATCH_FORMATS[format]) throw new Error('未対応の対局形式です');
  if (format === 'single') return '一局戦';
  if (!Number.isInteger(handNumber) || handNumber < 1 || handNumber > MATCH_FORMATS[format].games) {
    throw new Error('親番の番号が範囲外です');
  }
  if (!Number.isInteger(honba) || honba < 0) throw new Error('本場数が不正です');
  const wind = handNumber <= 4 ? '東' : '南';
  const number = ((handNumber - 1) % 4) + 1;
  return `${wind}${number}局 ${honba}本場`;
}

/** The first dealer is random; each subsequent scheduled hand changes dealer. */
function createMatch({ format = 'single', mode = 'cpu', seed = Date.now(), initialHand = 9, startingPlayer = null } = {}) {
  if (!MATCH_FORMATS[format]) throw new Error('未対応の対局形式です');
  if (!['cpu', 'local'].includes(mode)) throw new Error('未対応の対戦モードです');
  if (startingPlayer === null) startingPlayer = Math.floor(Math.random() * 2);
  if (startingPlayer !== 0 && startingPlayer !== 1) throw new Error('最初の親は0か1で指定してください');
  return {
    format, mode, initialHand,
    // totalGames is the number of scheduled dealer hands, NOT the maximum
    // number of games: dealer wins may extend the match.
    totalGames: MATCH_FORMATS[format].games,
    gameNumber: 1, handNumber: 1, dealer: startingPlayer,
    honba: 0, initialStarter: startingPlayer,
    points: [STARTING_POINTS, STARTING_POINTS],
    history: [], settled: false, complete: false,
    game: newGame({ mode, seed, initialHand, startingPlayer })
  };
}

/**
 * Settle one complete game.
 * A dealer's early win repeats the current scheduled hand and adds 1 honba.
 * A child's early win or exhaustion advances the parent and resets honba.
 * 5 × current honba is added to whoever goes out, in addition to +15 early.
 * Single-game matches always end after one game, without table-honba scoring.
 */
function settleMatchGame(match) {
  if (match.game.phase !== 'finished') throw new Error('ゲームがまだ終了していません');
  if (match.settled) return match.history.at(-1);
  const early = match.game.endReason === 'early';
  const winner = early ? match.game.endWinner : null;
  if (early && winner !== 0 && winner !== 1) throw new Error('早アガリした人を判定できません');
  const bonus = match.format !== 'single' && early ? match.honba * TABLE_HONBA_UNIT : 0;
  if (bonus) match.game.scores[winner].tableHonba += bonus;

  const scores = [totalScore(match.game, 0), totalScore(match.game, 1)];
  const delta = scores[0] - scores[1];
  match.points[0] += delta;
  match.points[1] -= delta;

  const repeat = match.format !== 'single' && early && winner === match.dealer;
  const record = {
    game: match.gameNumber, hand: match.handNumber,
    honba: match.honba, dealer: match.dealer,
    earlyWinner: winner, honbaPoints: bonus, renchan: repeat,
    scores, delta, points: [...match.points],
    winner: delta === 0 ? null : delta > 0 ? 0 : 1,
    reason: match.game.endReason
  };
  match.history.push(record);
  match.settled = true;

  if (repeat) {
    match.honba++;
  } else {
    match.honba = 0;
    match.handNumber++;
    match.dealer = 1 - match.dealer;
  }
  match.complete = match.format === 'single' || (!repeat && record.hand === match.totalGames);
  return record;
}

function nextMatchGame(match, seed = Date.now()) {
  if (!match.settled) throw new Error('現在のゲームが終了していません');
  if (match.complete) throw new Error('対局はすでに終了しています');
  match.gameNumber++;
  match.game = newGame({
    mode: match.mode, initialHand: match.initialHand, seed,
    startingPlayer: match.dealer
  });
  match.settled = false;
  return match.game;
}

function matchWinner(match) {
  if (!match.complete) return null;
  return match.points[0] === match.points[1] ? null : match.points[0] > match.points[1] ? 0 : 1;
}

/** Tree layout: the two opening tiles remain connected at the center.
 * Descendants grow outward on their own root side, with each double's
 * three free arms displayed in separate vertical lanes.
 */
function graphLayout(board) {
  const items=board.items,ports=boardPorts(board);
  const byParent=new Map(),portByOwner=new Map();
  for(const item of items.slice(2)){
    if(!byParent.has(item.parent))byParent.set(item.parent,[]);
    byParent.get(item.parent).push(item);
  }
  for(const p of ports){
    if(!portByOwner.has(p.owner))portByOwner.set(p.owner,[]);
    portByOwner.get(p.owner).push(p);
  }
  const gapX=122,gapY=95;
  const positions=new Map(),portPositions=new Map();
  let maxLeft=0,maxRight=0;
  const layout=(root,side)=>{
    let row=0,maxDepth=0;
    const walk=(item,depth)=>{
      maxDepth=Math.max(maxDepth,depth);
      const kids=(byParent.get(item.id)||[]).map(v=>({slot:v.slot||0,node:v,kind:'node'}));
      const ends=(portByOwner.get(item.id)||[]).map(v=>({slot:v.slot||0,node:v,kind:'port'}));
      const ordered=[...kids,...ends].sort((a,b)=>(a.slot===1?-1:a.slot===2?1:0)-(b.slot===1?-1:b.slot===2?1:0));
      const childrenY=[];
      for(const part of ordered){
        if(part.kind==='node'){
          const y=walk(part.node,depth+1);
          childrenY.push(y);
        }else{
          // Open port markers occupy an extra column beyond their parent.
          maxDepth=Math.max(maxDepth,depth+1);
          const y=row++*gapY;
          portPositions.set(part.node.key,{depth:depth+1,y,side});
          childrenY.push(y);
        }
      }
      const y=childrenY.length?(childrenY[0]+childrenY[childrenY.length-1])/2:row++*gapY;
      positions.set(item.id,{depth,y,side,item});
      return y;
    };
    walk(root,0);
    const rootY=positions.get(root.id).y;
    for(const pos of positions.values())if(pos.side===side)pos.y-=rootY;
    for(const pos of portPositions.values())if(pos.side===side)pos.y-=rootY;
    if(side==='left')maxLeft=maxDepth;
    else maxRight=maxDepth;
  };
  layout(items[0],'left');
  layout(items[1],'right');
  const pad=90,rootLeftX=pad+maxLeft*gapX,rootRightX=rootLeftX+gapX;
  const px=pos=>(pos.side==='left'?rootLeftX-pos.depth*gapX:rootRightX+pos.depth*gapX);
  const yList=[...positions.values(),...portPositions.values()].map(p=>p.y);
  const minY=Math.min(...yList,0),maxY=Math.max(...yList,0),shiftY=pad-minY;
  const width=rootRightX+maxRight*gapX+pad;
  const height=Math.max(205,maxY-minY+pad*2);
  return {items,ports,positions,portPositions,px,width,height,shiftY,rootLeftX,rootRightX,gapX,gapY};
}
function branchingBoardMarkup() {
  const layout=graphLayout(game.board);
  const {items,ports,positions,portPositions,px,width,height,shiftY,rootLeftX,rootRightX}=layout;
  const links=[];
  const line=(x1,y1,x2,y2)=>`<path d="M${x1} ${y1} H${(x1+x2)/2} V${y2} H${x2}" fill="none" stroke="#9abb97" stroke-width="3" stroke-linecap="round" opacity=".8"/>`;
  // Physical edges follow the recorded parent references, not screen order.
  links.push(line(rootLeftX,shiftY,rootRightX,shiftY));
  for(const item of items.slice(2)){
    const from=positions.get(item.parent),to=positions.get(item.id);
    if(from&&to)links.push(line(px(from),from.y+shiftY,px(to),to.y+shiftY));
  }
  const portsMarkup=ports.map((port,i)=>{
    const pos=portPositions.get(port.key);
    const base=positions.get(port.owner);
    if(!pos||!base)return '';
    const x=px(pos),y=pos.y+shiftY;
    links.push(line(px(base),base.y+shiftY,x,y));
    const direction=visualPortDirection(port,layout);
    return `<g data-port-key="${port.key}" data-port-label="${formatPort(port,i,layout)}" role="img" aria-label="${formatPort(port,i,layout)}"><title>${formatPort(port,i,layout)}</title>
      <circle cx="${x}" cy="${y}" r="24" fill="#1a4a3c" stroke="#e2bc76" stroke-width="2" stroke-dasharray="4 3"/>
      <text x="${x}" y="${y-3}" text-anchor="middle" font-size="15" font-weight="bold" fill="#f9df9e">${port.pip}</text>
      <text x="${x}" y="${y+14}" text-anchor="middle" font-size="11" fill="#f5e4bf">${direction}${i+1}</text></g>`;
  }).join('');
  const dominos=items.map((item,index)=>{
    const pos=positions.get(item.id);
    if(!pos)return '';
    const x=px(pos),y=pos.y+shiftY;
    const isDouble=item.a===item.b,vertical=isDouble&&index>=2;
    const w=vertical?46:80,h=vertical?72:46;
    const a=pos.side==='left'&&index>=2?item.b:item.a;
    const b=pos.side==='left'&&index>=2?item.a:item.b;
    return `<g transform="translate(${x} ${y})" aria-label="${a}｜${b}">
      <rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="7"
        fill="${isDouble?'#f5dca6':'#f0e9d9'}" stroke="${isDouble?'#d3a85b':'#ad9872'}" stroke-width="2"/>
      ${vertical?
        `<line x1="${-w/2+3}" y1="0" x2="${w/2-3}" y2="0" stroke="#857968" stroke-width="1.5"/>
          ${svgPipHalf(a,-w/2,-h/2,w,h/2)}
          ${svgPipHalf(b,-w/2,0,w,h/2)}`:
        `<line x1="0" y1="${-h/2+3}" x2="0" y2="${h/2-3}" stroke="#857968" stroke-width="1.5"/>
          ${svgPipHalf(a,-w/2,-h/2,w/2,h)}
          ${svgPipHalf(b,0,-h/2,w/2,h)}`}
      </g>`;
  }).join('');
  return `<div class="board-graph" role="img" aria-label="分岐するドミノ盤面。開放端は${ports.length}か所">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" aria-hidden="true">
      ${links.join('')}${dominos}${portsMarkup}
    </svg></div>`;
}

  const examples = MARTIAL.map(([name, a, b]) => `<tr><td>${name}</td><td>[${a.split('-').join('｜')}] + [${b.split('-').join('｜')}]</td></tr>`).join('');
  return `<div class="overlay" role="presentation" data-action="dismiss-help"><div class="modal" role="dialog" aria-modal="true" aria-label="ルールブック"><span class="eyebrow">HOW TO PLAY · VER 0.6</span><h2>賽棋のあそびかた</h2><p>2人に9枚ずつ配ってスタート · 役を作って場に出し、その後は数字を繋ぐ · 手札をなくすか山札が尽きたら精算するよ</p>
  <h3>対局形式と持ち点</h3><p>一局戦は1ゲーム。東風戦は東1〜東4局、半荘戦は東1〜東4局・南1〜南4局。親連荘では同じ局名のまま本場数が増えるよ。250点ずつ開始し、各ゲームの得点差を持ち点間で移動するよ。最初の親はランダム。親が早アガリしたら同じ親番を連荘し、本場が1増えるよ。子が早アガリしたり山枯らしで終了した場合は親が交代して本場は0に戻るよ。連荘分はゲーム数が増えるよ。単発の一局戦では連荘・本場点なし。飛び終了なし。</p>
  <h3>① 平場：天九</h3><p>先攻が2枚で役を出し、相手はより強い役でレイズできるよ · 各自1平場に1回、競り中に手札1〜全枚数を公開交換でき、交換後もその手番で出牌・見送りができるよ · レイズされた牌は公開除外されるけど、得点は残る · レイズが終わったら最後の役を起点に付札へ進むよ · レイズ点は最後のレイズ者が総取りだよ</p>
  <table class="mini-table"><tr><th>階級</th><th>役</th><th>役点</th></tr><tr><td>最高</td><td>至尊 [6｜6] + [0｜0]</td><td>20</td></tr><tr><td>上</td><td>文牌：同じ牌2枚</td><td>15</td></tr><tr><td>中</td><td>武牌：次の指定9組</td><td>10</td></tr><tr><td>下</td><td>雑：その他の2枚</td><td>5</td></tr></table>
  <h3>武牌9種の役表</h3><table class="mini-table"><tr><th>役</th><th>2枚組</th></tr>${examples}</table>
  <p class="footnote">文牌は原則ピップ合計で比較するよ · ただし [0｜0] の対子だけは [6｜6] の対子に勝つ特例があるよ · 雑同士のレイズは不可としているよ</p>
  <h3>② 付札：ドミノ</h3><p>最初の付札で左右どちらかの起点を選ぶよ · その後の通常付札は選んだ側の枝だけに接続（反対側の起点は閉じる） · ただし平場役が至尊 [6｜6]＋[0｜0] の場合は左右の起点を閉じず、両側から付札を続けられるよ · 1手で1枚か2枚を同じ枝に連続接続するよ · ゾロ目のダブル牌を置くと縦置きになり、接続した方向以外の3方向が開放されるよ · 枝は全部独立して伸ばせる · 至尊 [0｜0]＋[6｜6] だけは例外として数字0と6の2つの開放端へ同時に付札できるよ</p>
  <h3>③ パスと局の終了</h3><p>通常の付札でパスすると山札から1枚引くよ · 両者が連続パスしたら場の牌をすべて公開除外し、第N平場とレイズ数をリセットするよ（麻雀式の東N局・南N局とは別） · 局間は1枚ドローまたは手札1〜全枚数の公開交換が必須だよ · 交換は手札全部までOK（山札の残数が上限） · 除外した牌は山札に戻さず同数を補充するよ</p>
  <h3>④ 終局と得点</h3><p>手札0枚なら早アガリで即終了、山札0枚でも競りを見送った人は交互付札に参加するよ · 最終付札はドローなしで交互に続け、一度パスしても次の手番で再参加できるよ · 両者の連続パスで精算するよ</p>
  <table class="mini-table"><tr><th>項目</th><th>計算</th></tr><tr><td>役とピップ</td><td>出したときに加算</td></tr><tr><td>レイズ点</td><td>平場のレイズ回数×3点を最終レイズ者へ</td></tr><tr><td>本場点</td><td>東風・半荘のみ。早アガリした側に5×現在の本場数</td></tr><tr><td>早アガリ</td><td>+15点</td></tr><tr><td>山を最後に引いた人</td><td>−15点（強制補充を除く）</td></tr><tr><td>残った手札</td><td>ピップ合計÷2、切り上げで減点</td></tr></table>
  <p class="footnote">実装上の暫定裁定：平場の2枚は中央に並べ、外側に見えている数字を左右の開放端にするよ · 平場の見送り側が最初の付札を行うよ · 雑同士のレイズは不可 · 付札の至尊には役点は追加しないよ · 各ゲーム内の平場先攻は局ごとに交代するよ</p>
  <div class="modal-actions"><button class="button primary" data-action="close-help">盤面に戻る</button></div></div></div>`;
}
function endMarkup() {
  const scores = [totalScore(game,0),totalScore(game,1)];
  const record = match?.history.at(-1);
  const isComplete = Boolean(match?.complete);
  const winner = isComplete ? matchWinner(match) : record?.winner;
  const itemRows = ['role','pips','raise','early','tableHonba','lastDraw','remaining'];
  const labels = {role:'役点',pips:'ピップ点',raise:'レイズ点',early:'早アガリ',tableHonba:'本場点',lastDraw:'山枯らし減点',remaining:'残牌減点'};
  return `<div class="overlay" data-action="dismiss-results"><div class="modal" role="dialog" aria-modal="true"><span class="eyebrow">${isComplete?'MATCH SET · FINAL STANDINGS':'GAME SET · SCORE SETTLEMENT'}</span><h2>${isComplete?(winner===null?'対局終了 · 引き分け！':`${nameOf(winner)}の総合勝利！`):`${currentRoundName()} 終了`}</h2>
  <p>${game.endReason==='early'?'早アガリで終局':'山札が尽きて最終出牌終了'} · ${match.format==='single'?'一局戦':matchRoundName(match.format,record.hand,record.honba)}${record.renchan?' · 親連荘！':''} · ${isComplete?'対局終了':'次ゲームへ'}</p>
  <div class="winner-row"><span class="win-number">${scores[0]} <span style="font-size:21px;color:#cbd7c9">—</span> ${scores[1]}</span></div><div class="review-entry"><button class="button primary" data-action="inspect-board">◇ 終局時の盤面を見る →</button></div>
  <table class="mini-table"><tr><th>このゲームの内訳</th><th>${nameOf(0)}</th><th>${nameOf(1)}</th></tr>${itemRows.map(k=>`<tr><td>${labels[k]}</td><td>${k==='lastDraw'||k==='remaining'?'-':''}${game.scores[0][k]}</td><td>${k==='lastDraw'||k==='remaining'?'-':''}${game.scores[1][k]}</td></tr>`).join('')}<tr><th>ゲーム得点</th><th>${scores[0]}</th><th>${scores[1]}</th></tr></table>
  <div class="settlement"><span>得点差 ${record?.delta>0?'+':''}${record?.delta??0}点 → 持ち点に反映</span><div class="match-points"><div><small>${nameOf(0)}</small><strong>${match.points[0]}</strong></div><div><small>${nameOf(1)}</small><strong>${match.points[1]}</strong></div></div></div>
  ${isComplete?`<h3>総合成績</h3><table class="mini-table"><tr><th>局</th><th>${nameOf(0)}</th><th>${nameOf(1)}</th><th>得点差</th></tr>${match.history.map(r=>`<tr><td class="match-history-round"><strong>${matchRoundName(match.format,r.hand,r.honba)}</strong><small>第${r.game}ゲーム</small></td><td>${r.scores[0]}</td><td>${r.scores[1]}</td><td>${r.delta>0?'+':''}${r.delta}</td></tr>`).join('')}<tr><th>最終持ち点</th><th>${match.points[0]}</th><th>${match.points[1]}</th><th>合計500</th></tr></table>`:''}
  <div class="modal-actions">${isComplete?`<button class="button primary large" data-action="play-again">同じ形式でもう一戦！</button>`:`<button class="button primary large" data-action="next-game">次のゲームへ →</button>`}<button class="button quiet" data-action="back-home">タイトルへ</button></div></div></div>`;
}
function handoffMarkup() {
  return `<div class="overlay"><div class="modal privacy-view" role="dialog" aria-modal="true"><div class="symbol">◇</div><span class="eyebrow">PASS THE DEVICE</span><div class="title">${nameOf(game.current)}の番だよ</div><p>相手に手札が見えないよう端末を渡してね</p><div class="modal-actions" style="justify-content:center"><button class="button primary large" data-action="reveal">手札を確認して始める</button></div></div></div>`;
}
function render() {
  $app.innerHTML = `<div class="app-shell">${headerMarkup()}${game ? gameMarkup():homeMarkup()}<footer class="subfoot"><span>© Quad6 / 賽棋 · 2人用試遊版 · 無料 · インストール不要</span><span>天九の役 × ドミノの接続 × 累積得点 · <a class="source-link" href="${REPOSITORY_URL}" target="_blank" rel="noopener noreferrer">GitHubでソースを見る</a></span></footer></div>${helpOpen?helpMarkup():''}${game&&game.phase==='finished'&&!helpOpen&&!inspectFinalBoard?endMarkup():''}${game&&handoff&&game.phase!=='finished'&&!helpOpen?handoffMarkup():''}${toastMessage?`<div class="toast" role="status">${safe(toastMessage)}</div>`:''}`;
}
function notify(message) {
  toastMessage = message;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastMessage = ''; render(); }, 3100);
  render();
}
function resetTurnSelection() { selected = []; selectedMoveKey = null; flipped = {}; biddingExchangeMode = false; }
function goHome(confirmExit = true) {
  if (confirmExit && game && game.phase !== 'finished' && !window.confirm('現在の対局を終了してタイトルへ戻る？ 進行状況は失われます。')) return;
  clearTimeout(cpuTimer);
  clearTimeout(toastTimer);
  cpuTimer = null;
  game = null;
  match = null;
  busy = false;
  handoff = false;
  inspectFinalBoard = false;
  helpOpen = false;
  toastMessage = '';
  resetTurnSelection();
  render();
  window.scrollTo?.({top:0,behavior:'smooth'});
}
function showFinalBoard() {
  if (!game || game.phase !== 'finished') return;
  inspectFinalBoard = true;
  render();
  window.scrollTo?.({top:0,behavior:'smooth'});
}
function start(mode, format = selectedFormat) {
  clearTimeout(cpuTimer);
  const seed = Date.now() + Math.floor(Math.random()*100000);
  match = createMatch({ format, mode, initialHand:9, seed });
  game = match.game;
  selectedFormat = format;
  inspectFinalBoard = false;
  helpOpen = false;
  handoff = mode==='local';
  busy = false;
  resetTurnSelection();
  render();
  // The CPU may be drawn as the opening parent; let it make the first bid.
  scheduleCPU();
}
function settleIfFinished() {
  if (match && game.phase === 'finished') settleMatchGame(match);
}
function advanceGame() {
  if (!match?.settled || match.complete) return;
  clearTimeout(cpuTimer);
  game = nextMatchGame(match, Date.now() + Math.floor(Math.random()*100000));
  inspectFinalBoard = false;
  resetTurnSelection();
  handoff = game.mode === 'local';
  busy = false;
  render();
  scheduleCPU();
}
function run(action) {
  if (!game) return;
  const prior = game.current;
  try { dispatch(game, action); }
  catch (e) { notify(e.message); return; }
  settleIfFinished();
  resetTurnSelection();
  if (game.mode==='local' && game.phase!=='finished' && game.current!==prior) handoff = true;
  render();
  if (game.mode==='cpu' && game.phase!=='finished') scheduleCPU();
}
function scheduleCPU() {
  if (!game || game.mode!=='cpu' || game.current!==1 || busy || game.phase==='finished' || helpOpen) return;
  busy = true;
  render();
  const scheduledGame = game;
  cpuTimer = setTimeout(() => {
    busy=false;
    if (game !== scheduledGame || !game || game.current!==1 || game.phase==='finished' || helpOpen) return;
    try {
      const action = chooseAIAction(game);
      if (action) dispatch(game,action);
      settleIfFinished();
    } catch(e) { notify(`CPU処理エラー: ${e.message}`); return; }
    resetTurnSelection();
    render();
    if (game.mode==='cpu' && game.current===1 && game.phase!=='finished') scheduleCPU();
  }, 530);
}
$app.addEventListener('click', event => {
  const target = event.target.closest('[data-action]');
  if (!target) return;
  const action = target.dataset.action;
  // Only the backdrop itself dismisses a modal; clicks inside its panel are ignored.
  if (action==='dismiss-help') {
    if (event.target === target) { helpOpen=false;render();scheduleCPU(); }
    return;
  }
  if (action==='dismiss-results') {
    if (event.target === target) showFinalBoard();
    return;
  }
  if (action==='help') { helpOpen=true;render();return; }
  if (action==='close-help') { helpOpen=false;render();scheduleCPU();return; }
  if (action==='go-home') return goHome();
  if (action==='select-format' && !game) { selectedFormat=target.dataset.format;render();return; }
  if (action==='start-cpu') return start('cpu');
  if (action==='start-local') return start('local');
  if (action==='inspect-board') return showFinalBoard();
  if (action==='back-to-result' && game?.phase==='finished') { inspectFinalBoard=false;render();return; }
  if (action==='play-again') return start(game?.mode || 'cpu',match?.format || selectedFormat);
  if (action==='next-game') return advanceGame();
  if (action==='back-home') return goHome(false);
  if (action==='restart') { if(window.confirm('現在の対局を終了して最初からやり直す？')) start(game.mode,match.format); return; }
  if (action==='reveal') { handoff=false;render();return; }
  if (!game || game.phase==='finished' || helpOpen || handoff || !isHumanTurn()) return;
  const id = Number(target.dataset.id);
  if (action==='select') {
    const multi=game.phase==='adjustment'||(game.phase==='opening'&&biddingExchangeMode);
    const max = multi ? Math.min(game.hands[game.current].length,game.stock.length) : 2;
    if (selected.includes(id)) selected=selected.filter(v=>v!==id);
    else if (selected.length<max) selected.push(id);
    else if (!multi) selected=[selected[1],id];
    selectedMoveKey = null;
    render();return;
  }
  if (action==='flip') {flipped[id]=!flipped[id];render();return;}
  if (action==='clear') {selected=[];selectedMoveKey=null;flipped={};render();return;}
  if (action==='opening-exchange-mode' && game.phase==='opening') {
    if(!biddingExchangeMode && (game.final||game.bidExchanged?.[game.current]||!game.stock.length))return;
    biddingExchangeMode=!biddingExchangeMode;
    selected=[];selectedMoveKey=null;flipped={};
    render();return;
  }
  if (action==='bid-exchange' && game.phase==='opening' && biddingExchangeMode &&
    selected.length && selected.length<=game.stock.length)
    return run({type:'bidExchange',ids:[...selected]});
  if (action==='open') return run({type:'open',ids:[...selected],flips:selected.map(id=>Boolean(flipped[id]))});
  if (action==='passOpen') return run({type:'passOpen'});
  if (action==='choose-attachment') {
    if (!attachmentMoves(game, selected).some(move => move.key === target.dataset.key)) return;
    selectedMoveKey = target.dataset.key;
    render();return;
  }
  if (action==='attach') {
    const move = activeAttachmentMove(attachmentMoves(game, selected));
    if (!move) return;
    return run({type:'attach',ids:[...selected],moveKey:move.key});
  }
  if (action==='passAttach') return run({type:'passAttach'});
  if (action==='select-all-exchange' &&
      (game.phase==='adjustment'||(game.phase==='opening'&&biddingExchangeMode))) {
    const max = Math.min(game.hands[game.current].length, game.stock.length);
    selected = game.hands[game.current].slice(0, max);
    selectedMoveKey = null;
    render();return;
  }
  if (action==='adjust-draw') return run({type:'adjust',choice:'draw'});
  if (action==='adjust-exchange' && selected.length && selected.length<=game.stock.length) return run({type:'adjust',choice:'exchange',ids:[...selected]});
});
render();

</script>

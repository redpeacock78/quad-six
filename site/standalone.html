  <script type="module">
// ---- engine.js ----
/** 賽棋 Quad6 — dependency-free, deterministic rule engine. */

const MARTIAL = [
  ['雑十', '4-6', '5-5', 10],
  ['雑九', '3-6', '4-5', 9],
  ['雑八', '2-6', '3-5', 8],
  ['雑七', '2-5', '3-4', 7],
  ['雑六', '1-5', '2-4', 6],
  ['雑五', '1-4', '2-3', 5],
  ['雑四', '0-4', '1-3', 4],
  ['雑三', '0-3', '1-2', 3],
  ['雑二', '0-2', '1-1', 2],
];

const MARTIAL_LOOKUP = new Map(MARTIAL.map(([name, x, y, level]) => [pairKey(x, y), { name, level }]));
const ROLE_POINTS = { supreme: 20, civil: 15, martial: 10, common: 5 };
const DEFAULTS = { initialHand: 9, honbaUnit: 3, earlyBonus: 15, lastDrawPenalty: 15 };

function pairKey(a, b) { return [a, b].sort().join('+'); }
function random(seed) {
  let x = seed >>> 0;
  return () => {
    x += 0x6D2B79F5;
    let t = x;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const assert = (condition, message) => { if (!condition) throw new Error(message); };
const tileKey = (tile) => `${Math.min(tile.a, tile.b)}-${Math.max(tile.a, tile.b)}`;
const tilePips = (tile) => tile.a + tile.b;
const getTile = (game, id) => game.tiles[id];
const totalScore = (game, player) => {
  const s = game.scores[player];
  return s.role + s.pips + s.honba + s.early - s.lastDraw - s.remaining;
};
function tileset() {
  const tiles = [];
  for (let copy = 0; copy < 2; copy++) {
    for (let a = 0; a <= 6; a++) {
      for (let b = a; b <= 6; b++) tiles.push({ id: tiles.length, a, b, copy });
    }
  }
  return tiles;
}
function roleOf(game, ids) {
  assert(ids.length === 2, '役は2枚で構成する');
  const [a, b] = ids.map(id => tileKey(getTile(game, id)));
  if (pairKey(a, b) === pairKey('6-6', '0-0')) return { tier: 'supreme', name: '至尊', level: 99, points: 20 };
  if (a === b) {
    const tile = getTile(game, ids[0]);
    return { tier: 'civil', name: `文牌 ${tile.a}｜${tile.b}`, level: tile.a + tile.b, key: a, points: 15 };
  }
  const martial = MARTIAL_LOOKUP.get(pairKey(a, b));
  if (martial) return { tier: 'martial', name: martial.name, level: martial.level, points: 10 };
  return { tier: 'common', name: '雑', level: 0, points: 5 };
}
function isStronger(next, current) {
  if (!current) return true;
  const tier = { common: 0, martial: 1, civil: 2, supreme: 3 };
  if (tier[next.tier] !== tier[current.tier]) return tier[next.tier] > tier[current.tier];
  if (next.tier === 'civil') {
    // 0|0 pair is otherwise lowest, but it alone defeats the 6|6 pair.
    if (next.key === '0-0' && current.key === '6-6') return true;
    if (next.key === '6-6' && current.key === '0-0') return false;
  }
  return next.level > current.level;
}
function shuffle(ids, seed) {
  const rng = random(seed);
  for (let i = ids.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [ids[i], ids[j]] = [ids[j], ids[i]];
  }
}
function record(game, text, by = null) {
  game.history.unshift({ round: game.round, text, by });
  game.history.length = Math.min(70, game.history.length);
}
function stats(game) { return game.rounds[game.rounds.length - 1]; }
function award(game, player, field, points) {
  game.scores[player][field] += points;
  if (field === 'role' || field === 'pips' || field === 'honba') stats(game)[field][player] += points;
}
function other(p) { return 1 - p; }
function beginRound(game) {
  game.board = null;
  game.openingRole = null;
  game.honba = 0;
  game.lastOverwriter = null;
  game.passStreak = 0;
  game.adjustDone = [false, false];
  game.phase = 'opening';
  game.current = game.lead;
  game.rounds.push({ round: game.round, role: [0, 0], pips: [0, 0], honba: [0, 0] });
}
function newGame({ mode = 'cpu', initialHand = 9, seed = Date.now(), startingPlayer = 0 } = {}) {
  assert(startingPlayer === 0 || startingPlayer === 1, '先手は0か1');
  assert(initialHand >= 2 && initialHand <= 16, '初期手札は2〜16枚');
  const tiles = tileset();
  const stock = tiles.map(t => t.id);
  shuffle(stock, seed);
  const hands = [[], []];
  for (let i = 0; i < initialHand; i++) for (let p = 0; p < 2; p++) hands[p].push(stock.pop());
  const game = {
    version: 3, mode, seed, tiles, stock, hands,
    discard: [], board: null, current: startingPlayer, lead: startingPlayer, phase: 'opening', round: 1,
    final: false, finalOut: [false, false], lastDrawBy: null, lastDrawExempt: false,
    openingRole: null, honba: 0, lastOverwriter: null, passStreak: 0,
    scores: [0, 1].map(() => ({ role: 0, pips: 0, honba: 0, early: 0, lastDraw: 0, remaining: 0 })),
    rounds: [], history: [], adjustDone: [false, false], endReason: null,
    initialHand
  };
  beginRound(game);
  record(game, `対局開始 · 各${initialHand}枚 · 山札${stock.length}枚`);
  return game;
}
function handPairs(game, player = game.current, strongerOnly = false) {
  const hand = game.hands[player], result = [];
  for (let i = 0; i < hand.length; i++) for (let j = i + 1; j < hand.length; j++) {
    const ids = [hand[i], hand[j]];
    const role = roleOf(game, ids);
    if (!strongerOnly || isStronger(role, game.openingRole)) result.push({ ids, role });
  }
  return result;
}
function removeHand(game, p, ids) {
  assert(new Set(ids).size === ids.length, '同じ牌を2度指定できません');
  for (const id of ids) assert(game.hands[p].includes(id), '手札に存在しない牌');
  game.hands[p] = game.hands[p].filter(id => !ids.includes(id));
}
function oriented(game, id, flip = false) {
  const t = getTile(game, id);
  return { id, a: flip ? t.b : t.a, b: flip ? t.a : t.b };
}
function checkEndHand(game, player) {
  if (game.hands[player].length === 0) {
    finish(game, 'early', player);
    return true;
  }
  return false;
}
function settleOpening(game, passedBy) {
  if (game.honba > 0 && game.lastOverwriter != null) {
    const pts = game.honba * DEFAULTS.honbaUnit;
    award(game, game.lastOverwriter, 'honba', pts);
    record(game, `${game.honba}本場 · P${game.lastOverwriter + 1}が${pts}点総取り`, game.lastOverwriter);
  }
  game.phase = 'attachment';
  game.passStreak = 0;
  game.current = game.final && game.finalOut[passedBy] ? other(passedBy) : passedBy;
  record(game, '付札フェーズ開始');
}
function nextActive(game, player) { return game.final && game.finalOut[other(player)] ? player : other(player); }
function finish(game, reason, winner = null) {
  if (game.phase === 'finished') return;
  game.phase = 'finished';
  game.endReason = reason;
  if (reason === 'early') {
    // A last-tile opening bid can end the game before normal bidding settlement.
    if (game.phase === 'opening' && game.honba > 0 && game.lastOverwriter !== null) {
      award(game, game.lastOverwriter, 'honba', game.honba * DEFAULTS.honbaUnit);
    }
    game.scores[winner].early = DEFAULTS.earlyBonus;
    game.lastDrawBy = null; // early finish overrides LO penalty
    record(game, `P${winner + 1} 早アガリ · +${DEFAULTS.earlyBonus}点`, winner);
  } else if (game.lastDrawBy !== null && !game.lastDrawExempt) {
    game.scores[game.lastDrawBy].lastDraw = DEFAULTS.lastDrawPenalty;
  }
  for (let p = 0; p < 2; p++) {
    const pip = game.hands[p].reduce((a, id) => a + tilePips(getTile(game, id)), 0);
    game.scores[p].remaining = Math.ceil(pip / 2);
  }
  record(game, '終局 · 最終精算');
}
function toFinal(game, player, exempt = false) {
  if (game.final || game.phase === 'finished') return;
  game.final = true;
  game.finalOut = [false, false];
  game.lastDrawBy = player;
  game.lastDrawExempt = exempt;
  game.passStreak = 0;
  if (game.phase === 'adjustment') {
    game.phase = 'opening';
    game.current = game.lead;
  }
  record(game, exempt ? '強制補充による山枯らし · 罰点なし' : `P${player + 1}が最後の牌を引いた · 最終出牌へ`, player);
}
function draw(game, player, exempt = false) {
  if (game.stock.length === 0) return false;
  game.hands[player].push(game.stock.pop());
  if (game.stock.length === 0) toFinal(game, player, exempt);
  return true;
}
function endRound(game) {
  if (game.board) game.discard.push(...game.board.items.map(p => p.id));
  record(game, `第${game.round}局終了 · 場の牌を公開除外`);
  game.board = null;
  game.openingRole = null;
  game.honba = 0;
  game.lastOverwriter = null;
  game.passStreak = 0;
  game.round += 1;
  game.lead = other(game.lead);
  game.current = game.lead;
  game.phase = 'adjustment';
  game.adjustDone = [false, false];
  // If stock empties exactly after a normal pass, toFinal prevents resetting.
}
function startAfterAdjust(game) {
  // Special mandatory refill of 2 for a one-tile hand; if it exhausts stock, final play starts without LO penalty.
  for (let p = 0; p < 2; p++) {
    if (game.hands[p].length !== 1) continue;
    record(game, `P${p + 1} 手札1枚 · 2枚の強制補充`, p);
    for (let k = 0; k < 2; k++) {
      if (!draw(game, p, true)) break;
    }
    if (game.final) break;
  }
  beginRound(game);
  if (game.final) {
    game.current = game.lead;
    record(game, '場が空の状態から最終平場を開始');
  } else record(game, `第${game.round}局開始`);
}
function orientationVariants(game, id) {
  const t = getTile(game, id);
  if (t.a === t.b) return [oriented(game, id, false)];
  return [oriented(game, id, false), oriented(game, id, true)];
}
/** Legal attachment actions for a set of 1 or 2 distinct tiles. */
function attachmentMoves(game, ids, player = game.current) {
  if (game.phase !== 'attachment' || !game.board || ids.length < 1 || ids.length > 2) return [];
  if (new Set(ids).size !== ids.length || ids.some(id => !game.hands[player].includes(id))) return [];
  const items = game.board.items;
  const left = items[0].a, right = items[items.length - 1].b;
  const out = [], seen = new Set();
  const push = (side, placements, special = false) => {
    const key = `${side}:${placements.map(p => `${p.id}/${p.a}/${p.b}`).join(':')}`;
    if (!seen.has(key)) { seen.add(key); out.push({ side, placements, special, key }); }
  };
  if (ids.length === 1) {
    for (const v of orientationVariants(game, ids[0])) {
      if (v.b === left) push('left', [v]);
      if (v.a === right) push('right', [v]);
    }
  } else {
    for (const order of [ids, [ids[1], ids[0]]]) {
      for (const a of orientationVariants(game, order[0])) {
        for (const b of orientationVariants(game, order[1])) {
          // right: first tile touches existing right endpoint
          if (a.a === right && a.b === b.a) push('right', [a, b]);
          // left: first tile is closest to board, second tile is outermost
          if (a.b === left && b.b === a.a) push('left', [b, a]);
        }
      }
    }
    const keys = ids.map(id => tileKey(getTile(game, id)));
    if (pairKey(...keys) === pairKey('0-0', '6-6')) {
      const zero = oriented(game, ids[keys.indexOf('0-0')]);
      const six = oriented(game, ids[keys.indexOf('6-6')]);
      if (left === 0 && right === 6) push('both', [zero, six], true);
      if (left === 6 && right === 0) push('both', [six, zero], true);
    }
  }
  return out;
}
function allAttachmentMoves(game, player = game.current) {
  const hand = game.hands[player];
  const result = [];
  for (let i = 0; i < hand.length; i++) {
    result.push(...attachmentMoves(game, [hand[i]], player));
    for (let j = i + 1; j < hand.length; j++) result.push(...attachmentMoves(game, [hand[i], hand[j]], player));
  }
  return result;
}
function dispatch(game, action) {
  assert(game.phase !== 'finished', '既に終局しています');
  const p = game.current;
  switch (action.type) {
    case 'open': {
      assert(game.phase === 'opening', '平場ではありません');
      const ids = action.ids || [];
      assert(ids.length === 2, '役は2枚で出してください');
      assert(ids.every(id => game.hands[p].includes(id)) && ids[0] !== ids[1], '手札を2枚選んでください');
      const role = roleOf(game, ids);
      assert(isStronger(role, game.openingRole), '現在の役を上書きできません');
      if (game.board) {
        game.discard.push(...game.board.items.map(item => item.id));
        game.honba++;
        game.lastOverwriter = p;
      }
      const flips = action.flips || [false, false];
      game.board = { items: ids.map((id, i) => oriented(game, id, Boolean(flips[i]))), splitIndex: 1 };
      removeHand(game, p, ids);
      game.openingRole = role;
      award(game, p, 'role', role.points);
      award(game, p, 'pips', ids.reduce((s, id) => s + tilePips(getTile(game, id)), 0));
      record(game, `P${p + 1} ${role.name} · +${role.points}役点${game.honba ? ` · ${game.honba}本場` : ''}`, p);
      if (checkEndHand(game, p)) break;
      game.current = nextActive(game, p);
      if (game.final && game.current === p) settleOpening(game, other(p));
      break;
    }
    case 'passOpen': {
      assert(game.phase === 'opening', '平場ではありません');
      if (!game.final) {
        assert(game.board, '最初の役は必ず出してください');
        record(game, `P${p + 1} 上書きを見送り`, p);
        settleOpening(game, p);
      } else {
        game.finalOut[p] = true;
        record(game, `P${p + 1} 最終平場をパス · 脱落`, p);
        if (game.finalOut.every(Boolean)) finish(game, 'exhaustion');
        else if (game.board) settleOpening(game, p);
        else game.current = other(p);
      }
      break;
    }
    case 'attach': {
      assert(game.phase === 'attachment', '付札フェーズではありません');
      const ids = action.ids || [];
      const candidates = attachmentMoves(game, ids, p);
      const move = candidates.find(x => x.key === action.moveKey);
      assert(move, 'その接続はできません');
      removeHand(game, p, ids);
      if (move.side === 'left') {
        game.board.items.unshift(...move.placements);
        game.board.splitIndex += move.placements.length;
      } else if (move.side === 'right') {
        game.board.items.push(...move.placements);
      } else {
        game.board.items.unshift(move.placements[0]);
        game.board.items.push(move.placements[1]);
        game.board.splitIndex++;
      }
      award(game, p, 'pips', ids.reduce((s, id) => s + tilePips(getTile(game, id)), 0));
      game.passStreak = 0;
      record(game, `P${p + 1} ${ids.length}枚付札${move.special ? ' · 至尊の両側接続' : ''}`, p);
      if (checkEndHand(game, p)) break;
      game.current = nextActive(game, p);
      break;
    }
    case 'passAttach': {
      assert(game.phase === 'attachment', '付札フェーズではありません');
      if (game.final) {
        game.finalOut[p] = true;
        record(game, `P${p + 1} 最終付札をパス · 脱落`, p);
        if (game.finalOut.every(Boolean)) finish(game, 'exhaustion');
        else game.current = other(p);
      } else {
        const drawn = draw(game, p);
        record(game, `P${p + 1} パス · ${drawn ? '1枚ドロー' : '山札なし'}`, p);
        if (game.final) {
          game.current = other(p);
          break;
        }
        game.passStreak++;
        if (game.passStreak >= 2) endRound(game);
        else game.current = other(p);
      }
      break;
    }
    case 'adjust': {
      assert(game.phase === 'adjustment', '手札調整ではありません');
      assert(!game.adjustDone[p], '調整は各自1回です');
      assert(['none', 'draw', 'exchange'].includes(action.choice), '無効な調整方法');
      if (action.choice === 'exchange') {
        const id = action.id;
        assert(game.hands[p].includes(id), '交換する牌を選択してください');
        assert(game.stock.length > 0, '山札がありません');
        removeHand(game, p, [id]);
        game.discard.push(id);
        draw(game, p);
        record(game, `P${p + 1} 1枚公開交換`, p);
      } else if (action.choice === 'draw') {
        assert(game.stock.length > 0, '山札がありません');
        draw(game, p);
        record(game, `P${p + 1} 1枚補充`, p);
      } else record(game, `P${p + 1} 調整なし`, p);
      game.adjustDone[p] = true;
      if (game.final) break;
      if (game.adjustDone.every(Boolean)) startAfterAdjust(game);
      else game.current = other(p);
      break;
    }
    default: throw new Error(`未対応のアクション: ${action.type}`);
  }
  return game;
}

// ---- ai.js ----


/** An intentionally readable starter opponent, not an optimal solver. */
function chooseAIAction(game) {
  const p = game.current, hand = game.hands[p];
  if (game.phase === 'opening') {
    let candidates = handPairs(game, p, Boolean(game.board));
    if (candidates.length === 0) return { type: 'passOpen' };
    // Reserve supreme occasionally for the next round when opening the table.
    const tiers = { supreme: 5, civil: 4, martial: 3, common: 1 };
    candidates = candidates.map(c => ({ ...c, value: tiers[c.role.tier] * 15 + c.role.level * .7 + c.ids.reduce((v, id) => v + tilePips(getTile(game, id)), 0) * .2 }));
    if (game.board) {
      candidates.sort((a, b) => a.value - b.value);
      // Cheaper valid overwrite normally wins; occasionally seek power.
      if (game.final || Math.random() > .16) candidates = [candidates[0]];
      else candidates = [candidates[candidates.length - 1]];
    } else {
      candidates.sort((a, b) => b.value - a.value);
      if (candidates[0].role.tier === 'supreme' && Math.random() > .55 && candidates.length > 1) candidates.shift();
    }
    const picked = candidates[0];
    const flips = [false, false];
    return { type: 'open', ids: picked.ids, flips };
  }
  if (game.phase === 'attachment') {
    const options = allAttachmentMoves(game, p);
    if (!options.length) return { type: 'passAttach' };
    const scored = options.map(move => {
      const points = move.placements.reduce((sum, v) => sum + v.a + v.b, 0);
      const endValue = move.side === 'left' ? move.placements[0].a : move.side === 'right' ? move.placements[move.placements.length - 1].b : 3;
      const compatible = hand.filter(id => !move.placements.some(v => v.id === id))
        .filter(id => { const t = getTile(game, id); return t.a === endValue || t.b === endValue; }).length;
      return { move, value: move.placements.length * 22 + points * .7 + compatible * 3 + (move.special ? 11 : 0) + Math.random() * 2 };
    });
    scored.sort((a, b) => b.value - a.value);
    const move = scored[0].move;
    return { type: 'attach', ids: move.placements.map(v => v.id), moveKey: move.key };
  }
  if (game.phase === 'adjustment') {
    if (game.stock.length === 0) return { type: 'adjust', choice: 'none' };
    if (hand.length < 3 && Math.random() < .6) return { type: 'adjust', choice: 'draw' };
    if (Math.random() < .65 && hand.length >= 4) {
      const cnt = new Map();
      for (const id of hand) cnt.set(tileKey(getTile(game, id)), (cnt.get(tileKey(getTile(game, id))) || 0) + 1);
      const candidates = hand.filter(id => cnt.get(tileKey(getTile(game, id))) === 1)
        .filter(id => !['0-0', '6-6'].includes(tileKey(getTile(game, id))));
      if (candidates.length) {
        candidates.sort((a, b) => tilePips(getTile(game, b)) - tilePips(getTile(game, a)));
        return { type: 'adjust', choice: 'exchange', id: candidates[0] };
      }
    }
    return { type: 'adjust', choice: 'none' };
  }
  return null;
}

// ---- match.js ----
/** Multi-game match: keeps the 56-tile game rules unchanged. */

const MATCH_FORMATS = Object.freeze({
  single: { label: '一局戦', games: 1 },
  tonpu: { label: '東風戦', games: 4 },
  hanchan: { label: '半荘戦', games: 8 }
});
const STARTING_POINTS = 250;

function createMatch({ format = 'single', mode = 'cpu', seed = Date.now(), initialHand = 9 } = {}) {
  if (!MATCH_FORMATS[format]) throw new Error('未対応の対局形式です');
  if (!['cpu', 'local'].includes(mode)) throw new Error('未対応の対戦モードです');
  return {
    format, mode, initialHand, totalGames: MATCH_FORMATS[format].games,
    gameNumber: 1, points: [STARTING_POINTS, STARTING_POINTS],
    history: [], settled: false, complete: false,
    game: newGame({ mode, seed, initialHand, startingPlayer: 0 })
  };
}

/** Each game's *difference* is transferred; the total point pool stays at 500. */
function settleMatchGame(match) {
  if (match.game.phase !== 'finished') throw new Error('ゲームがまだ終了していません');
  if (match.settled) return match.history.at(-1);
  const scores = [totalScore(match.game, 0), totalScore(match.game, 1)];
  const delta = scores[0] - scores[1];
  match.points[0] += delta;
  match.points[1] -= delta;
  const record = {
    game: match.gameNumber, scores, delta,
    points: [...match.points],
    winner: delta === 0 ? null : delta > 0 ? 0 : 1,
    reason: match.game.endReason
  };
  match.history.push(record);
  match.settled = true;
  match.complete = match.gameNumber === match.totalGames;
  return record;
}

function nextMatchGame(match, seed = Date.now()) {
  if (!match.settled) throw new Error('現在のゲームが終了していません');
  if (match.complete) throw new Error('対局はすでに終了しています');
  match.gameNumber++;
  match.game = newGame({ mode: match.mode, initialHand: match.initialHand, seed,
    startingPlayer: (match.gameNumber - 1) % 2 });
  match.settled = false;
  return match.game;
}

function matchWinner(match) {
  if (!match.complete) return null;
  return match.points[0] === match.points[1] ? null : match.points[0] > match.points[1] ? 0 : 1;
}

  <h3>④ 終局と得点</h3><p>手札0枚なら早アガリで即終了、山札0枚なら最後の付札を続けて精算するよ · 最終付札中のパスは脱落になるよ</p>
  <table class="mini-table"><tr><th>項目</th><th>計算</th></tr><tr><td>役とピップ</td><td>出したときに加算</td></tr><tr><td>本場</td><td>最終上書き者に1本×3点</td></tr><tr><td>早アガリ</td><td>+15点</td></tr><tr><td>山を最後に引いた人</td><td>−15点（強制補充を除く）</td></tr><tr><td>残った手札</td><td>ピップ合計÷2、切り上げで減点</td></tr></table>
  <p class="footnote">実装上の暫定裁定：平場の2枚は中央に並べ、外側に見えている数字を左右の開放端にするよ · 平場の見送り側が最初の付札を行うよ · 雑同士の上書きは不可 · 付札の至尊には役点は追加しないよ · 先攻は局ごと交代するよ</p>
  <div class="modal-actions"><button class="button primary" data-action="close-help">盤面に戻る</button></div></div></div>`;
}
function endMarkup() {
  const scores = [totalScore(game,0),totalScore(game,1)];
  const record = match?.history.at(-1);
  const isComplete = Boolean(match?.complete);
  const winner = isComplete ? matchWinner(match) : record?.winner;
  const itemRows = ['role','pips','honba','early','lastDraw','remaining'];
  const labels = {role:'役点',pips:'ピップ点',honba:'本場点',early:'早アガリ',lastDraw:'山枯らし減点',remaining:'残牌減点'};
  return `<div class="overlay"><div class="modal" role="dialog" aria-modal="true"><span class="eyebrow">${isComplete?'MATCH SET · FINAL STANDINGS':'GAME SET · SCORE SETTLEMENT'}</span><h2>${isComplete?(winner===null?'対局終了 · 引き分け！':`${nameOf(winner)}の総合勝利！`):`第${match.gameNumber}ゲーム終了`}</h2>
  <p>${game.endReason==='early'?'早アガリで終局':'山札が尽きて最終出牌終了'} · ${isComplete?`${MATCH_FORMATS[match.format].label}の全${match.totalGames}ゲーム終了`:`残り${match.totalGames-match.gameNumber}ゲーム`}</p>
  <div class="winner-row"><span class="win-number">${scores[0]} <span style="font-size:21px;color:#cbd7c9">—</span> ${scores[1]}</span></div><div class="review-entry"><button class="button primary" data-action="inspect-board">◇ 終局時の盤面を見る →</button></div>
  <table class="mini-table"><tr><th>このゲームの内訳</th><th>${nameOf(0)}</th><th>${nameOf(1)}</th></tr>${itemRows.map(k=>`<tr><td>${labels[k]}</td><td>${k==='lastDraw'||k==='remaining'?'-':''}${game.scores[0][k]}</td><td>${k==='lastDraw'||k==='remaining'?'-':''}${game.scores[1][k]}</td></tr>`).join('')}<tr><th>ゲーム得点</th><th>${scores[0]}</th><th>${scores[1]}</th></tr></table>
  <div class="settlement"><span>得点差 ${record?.delta>0?'+':''}${record?.delta??0}点 → 持ち点に反映</span><div class="match-points"><div><small>${nameOf(0)}</small><strong>${match.points[0]}</strong></div><div><small>${nameOf(1)}</small><strong>${match.points[1]}</strong></div></div></div>
  ${isComplete?`<h3>総合成績</h3><table class="mini-table"><tr><th>ゲーム</th><th>${nameOf(0)}</th><th>${nameOf(1)}</th><th>得点差</th></tr>${match.history.map(r=>`<tr><td>${r.game}</td><td>${r.scores[0]}</td><td>${r.scores[1]}</td><td>${r.delta>0?'+':''}${r.delta}</td></tr>`).join('')}<tr><th>最終持ち点</th><th>${match.points[0]}</th><th>${match.points[1]}</th><th>合計500</th></tr></table>`:''}
  <div class="modal-actions">${isComplete?`<button class="button primary large" data-action="play-again">同じ形式でもう一戦！</button>`:`<button class="button primary large" data-action="next-game">次のゲームへ →</button>`}<button class="button quiet" data-action="back-home">タイトルへ</button></div></div></div>`;
}
function handoffMarkup() {
  return `<div class="overlay"><div class="modal privacy-view" role="dialog" aria-modal="true"><div class="symbol">◇</div><span class="eyebrow">PASS THE DEVICE</span><div class="title">${nameOf(game.current)}の番だよ</div><p>相手に手札が見えないよう端末を渡してね</p><div class="modal-actions" style="justify-content:center"><button class="button primary large" data-action="reveal">手札を確認して始める</button></div></div></div>`;
}
function render() {
  $app.innerHTML = `<div class="app-shell">${headerMarkup()}${game ? gameMarkup():homeMarkup()}<footer class="subfoot"><span>© Quad6 / 賽棋 · 2人用試遊版 · 無料 · インストール不要</span><span>天九の役 × ドミノの接続 × 累積得点</span></footer></div>${helpOpen?helpMarkup():''}${game&&game.phase==='finished'&&!helpOpen&&!inspectFinalBoard?endMarkup():''}${game&&handoff&&game.phase!=='finished'&&!helpOpen?handoffMarkup():''}${toastMessage?`<div class="toast" role="status">${safe(toastMessage)}</div>`:''}`;
}
function notify(message) {
  toastMessage = message;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastMessage = ''; render(); }, 3100);
  render();
}
function resetTurnSelection() { selected = []; flipped = {}; }
function start(mode, format = selectedFormat) {
  clearTimeout(cpuTimer);
  const seed = Date.now() + Math.floor(Math.random()*100000);
  match = createMatch({ format, mode, initialHand:9, seed });
  game = match.game;
  selectedFormat = format;
  inspectFinalBoard = false;
  helpOpen = false;
  handoff = mode==='local';
  busy = false;
  resetTurnSelection();
  render();
}
function settleIfFinished() {
  if (match && game.phase === 'finished') settleMatchGame(match);
}
function advanceGame() {
  if (!match?.settled || match.complete) return;
  clearTimeout(cpuTimer);
  game = nextMatchGame(match, Date.now() + Math.floor(Math.random()*100000));
  inspectFinalBoard = false;
  resetTurnSelection();
  handoff = game.mode === 'local';
  busy = false;
  render();
  scheduleCPU();
}
function run(action) {
  if (!game) return;
  const prior = game.current;
  try { dispatch(game, action); }
  catch (e) { notify(e.message); return; }
  settleIfFinished();
  resetTurnSelection();
  if (game.mode==='local' && game.phase!=='finished' && game.current!==prior) handoff = true;
  render();
  if (game.mode==='cpu' && game.phase!=='finished') scheduleCPU();
}
function scheduleCPU() {
  if (!game || game.mode!=='cpu' || game.current!==1 || busy || game.phase==='finished' || helpOpen) return;
  busy = true;
  render();
  const scheduledGame = game;
  cpuTimer = setTimeout(() => {
    busy=false;
    if (game !== scheduledGame || !game || game.current!==1 || game.phase==='finished' || helpOpen) return;
    try {
      const action = chooseAIAction(game);
      if (action) dispatch(game,action);
      settleIfFinished();
    } catch(e) { notify(`CPU処理エラー: ${e.message}`); return; }
    resetTurnSelection();
    render();
    if (game.mode==='cpu' && game.current===1 && game.phase!=='finished') scheduleCPU();
  }, 530);
}
$app.addEventListener('click', event => {
  const target = event.target.closest('[data-action]');
  if (!target) return;
  const action = target.dataset.action;
  if (action==='help') { helpOpen=true;render();return; }
  if (action==='close-help') { helpOpen=false;render();scheduleCPU();return; }
  if (action==='select-format' && !game) { selectedFormat=target.dataset.format;render();return; }
  if (action==='start-cpu') return start('cpu');
  if (action==='start-local') return start('local');
  if (action==='inspect-board' && game?.phase==='finished') { inspectFinalBoard=true;render();return; }
  if (action==='back-to-result' && game?.phase==='finished') { inspectFinalBoard=false;render();return; }
  if (action==='play-again') return start(game?.mode || 'cpu',match?.format || selectedFormat);
  if (action==='next-game') return advanceGame();
  if (action==='back-home') {clearTimeout(cpuTimer);game=null;match=null;handoff=false;inspectFinalBoard=false;helpOpen=false;render();return;}
  if (action==='restart') { if(window.confirm('現在の対局を終了して最初からやり直す？')) start(game.mode,match.format); return; }
  if (action==='reveal') { handoff=false;render();return; }
  if (!game || game.phase==='finished' || helpOpen || handoff || !isHumanTurn()) return;
  const id = Number(target.dataset.id);
  if (action==='select') {
    if (selected.includes(id)) selected=selected.filter(v=>v!==id);
    else if (selected.length<2) selected.push(id);
    else selected=[selected[1],id];
    render();return;
  }
  if (action==='flip') {flipped[id]=!flipped[id];render();return;}
  if (action==='clear') {resetTurnSelection();render();return;}
  if (action==='open') return run({type:'open',ids:[...selected],flips:selected.map(id=>Boolean(flipped[id]))});
  if (action==='passOpen') return run({type:'passOpen'});
  if (action==='attach') return run({type:'attach',ids:[...selected],moveKey:target.dataset.key});
  if (action==='passAttach') return run({type:'passAttach'});
  if (action==='adjust-draw') return run({type:'adjust',choice:'draw'});
  if (action==='adjust-none') return run({type:'adjust',choice:'none'});
  if (action==='adjust-exchange') return run({type:'adjust',choice:'exchange',id:selected[0]});
});
render();

</script>
</body>
